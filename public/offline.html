<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeStrike - Offline Mode</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
        user-select: none;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        color: #38bdf8;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 8px;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #fbbf24;
        font-size: 12px;
        font-family: monospace;
        margin-bottom: 16px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 10px;
        background: #0284c7;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: background 0.2s;
        width: 100%;
      }
      .btn:hover {
        background: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.44 9a15.93 15.93 0 014.88-2.61M8.53 16.11a6 6 0 016.95 0M12 20h.01" />
      </svg>
      <div class="badge">OFFLINE EMERGENCY PROTOCOL</div>
      <h1>Connection Lost</h1>
      <p>You are currently offline. TypeStrike will automatically reconnect once your network connectivity is restored.</p>
      <button class="btn" onclick="window.location.reload()">Retry Reconnect</button>
    </div>
  </body>
</html>
